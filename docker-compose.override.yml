services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: boutique-mailhog
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]
    networks: [boutique-network]
  order-service:
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-boutique}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-boutique_password}
  payment-service:
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-boutique}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-boutique_password}
      DEMO_PAYMENT_LATENCY_MS: ${DEMO_PAYMENT_LATENCY_MS:-180}
  shipping-service:
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-boutique}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-boutique_password}
  notification-service:
    depends_on:
      mailhog: {condition: service_started}
      redis: {condition: service_healthy}
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-boutique}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-boutique_password}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      NOTIFICATION_EMAIL_FROM: no-reply@boutique.local
      NOTIFICATION_EMAIL_DEFAULT_RECIPIENT: demo.customer@boutique.local
  frontend:
    environment:
      VITE_PAYMENT_API_URL: /payment-api
      VITE_PAYMENT_SERVICE_TARGET: http://payment-service:8085
      VITE_AUTH_MODE: local
