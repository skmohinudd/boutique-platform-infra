apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:

  amiSelectorTerms:
    - alias: al2023@latest

  role: KarpenterNodeRole-boutique-dev-eks

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: boutique-dev-eks

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: boutique-dev-eks

  tags:
    Name: karpenter-boutique-dev-eks
    karpenter.sh/discovery: boutique-dev-eks
