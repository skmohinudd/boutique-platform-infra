apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.ingress.name }}"
  annotations:
    kubernetes.io/ingress.class: "{{ .Values.ingress.className }}"
    alb.ingress.kubernetes.io/scheme: "{{ .Values.ingress.scheme }}"
    alb.ingress.kubernetes.io/target-type: "{{ .Values.ingress.targetType }}"
    alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.ingress.certificateArn }}"
    alb.ingress.kubernetes.io/subnets: "{{ .Values.ingress.subnets }}"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "{{ .Values.ingress.sslRedirect }}"
    alb.ingress.kubernetes.io/healthcheck-path: "{{ .Values.ingress.healthCheckPath }}"
    alb.ingress.kubernetes.io/healthcheck-port: "{{ .Values.ingress.healthCheckPort }}"
    alb.ingress.kubernetes.io/success-codes: "{{ .Values.ingress.successCodes }}"
spec:
  ingressClassName: "{{ .Values.ingress.className }}"
  rules:
    - host: "{{ .Values.ingress.host }}"
      http:
        paths:
          - path: "{{ .Values.routes.product.path }}"
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.routes.product.serviceName }}"
                port: { number: {{ .Values.routes.product.servicePort }} }
          - path: "{{ .Values.routes.inventory.path }}"
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.routes.inventory.serviceName }}"
                port: { number: {{ .Values.routes.inventory.servicePort }} }
          - path: "{{ .Values.routes.user.path }}"
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.routes.user.serviceName }}"
                port: { number: {{ .Values.routes.user.servicePort }} }
          - path: "{{ .Values.routes.cart.path }}"
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.routes.cart.serviceName }}"
                port: { number: {{ .Values.routes.cart.servicePort }} }
          - path: "{{ .Values.routes.order.path }}"
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.routes.order.serviceName }}"
                port: { number: {{ .Values.routes.order.servicePort }} }
          - path: "{{ .Values.routes.payment.path }}"
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.routes.payment.serviceName }}"
                port: { number: {{ .Values.routes.payment.servicePort }} }
          - path: "{{ .Values.routes.checkout.path }}"
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.routes.checkout.serviceName }}"
                port: { number: {{ .Values.routes.checkout.servicePort }} }
          - path: "{{ .Values.routes.shipping.path }}"
            pathType: Prefix
            backend:
              service:
                name: "{{ .Values.routes.shipping.serviceName }}"
                port: { number: {{ .Values.routes.shipping.servicePort }} }
