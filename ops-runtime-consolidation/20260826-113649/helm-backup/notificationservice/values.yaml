name: notificationservice
configMapName: notificationservice-config
image:
  repository: 663130434910.dkr.ecr.us-east-1.amazonaws.com/boutique-notificationservice
  tag: "1.0.4-202608231430"
  pullPolicy: IfNotPresent
serviceAccount:
  name: notificationservice-sa
  automountServiceAccountToken: false
config:
  kafkaBootstrapServers: "kafka:9092"
  kafkaConsumerGroup: "notification-service"
  kafkaOrderEventsTopic: "boutique.order.events"
  kafkaPaymentEventsTopic: "boutique.payment.events"
  kafkaShippingEventsTopic: "boutique.shipping.events"
  redisHost: "redis"
  redisPort: "6379"
  rabbitmqHost: "rabbitmq"
  rabbitmqPort: "5672"
  mailHost: "mailpit"
  mailPort: "1025"
  dedupeTtl: "7d"
  emailDefaultRecipient: "demo.customer@boutique.local"
  emailFrom: "no-reply@boutique.local"
  userServiceUrl: "http://userservice:8082"
revisionHistoryLimit: 5
progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 30
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
topologySpread:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
autoscaling:
  minReplicas: 1
  maxReplicas: 3
  cpuAverageUtilization: 70
  scaleDownStabilizationSeconds: 300
pdb:
  minAvailable: 1
