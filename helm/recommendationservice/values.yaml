# BOUTIQUE-VALUES-SECTIONS-BEGIN
# Section comments below explain the responsibility of major values keys.
# BOUTIQUE-VALUES-SECTIONS-END
# BOUTIQUE-DOCS-BEGIN
# Central values for this Helm chart.
# Templates read these values using {{ .Values.<key> }}.
# Change Kubernetes desired configuration here rather than using kubectl edit.
# CI/CD intentionally overrides image.repository and image.tag at deployment time
# so Nexus JAR, ECR image, Helm release and EKS run the same immutable version.
# BOUTIQUE-DOCS-END

# name: Kubernetes application/resource identity used by templates.
name: recommendationservice
# configMapName: name of the non-secret runtime configuration ConfigMap.
configMapName: recommendationservice-config
# containerPort: TCP port on which this application process listens.
containerPort: 8088
# image: ECR repository/tag/pull policy. CI/CD overrides repository/tag for releases.
image:
  repository: 663130434910.dkr.ecr.us-east-1.amazonaws.com/boutique-recommendationservice-java
  tag: "1.0.2"
  pullPolicy: IfNotPresent
# service: stable ClusterIP port/targetPort used for in-cluster communication.
service:
  type: ClusterIP
  port: 8088
  targetPort: 8088
# serviceAccount: Pod Kubernetes identity and token-mount behavior.
serviceAccount:
  name: recommendationservice-sa
  automountServiceAccountToken: false
# config: non-secret runtime env values such as DNS URLs, topics and feature flags.
config:
  serverPort: "8088"
  corsAllowedOrigins: "https://needystuff.in,http://localhost:4173,http://localhost:5173"
  productServiceUrl: "http://productcatalogservice:8080"
# revisionHistoryLimit: number of old ReplicaSets Kubernetes retains for rollback.
revisionHistoryLimit: 5
progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 30
strategy:
  type: RollingUpdate
  maxUnavailable: 0
  maxSurge: 1
# resources: CPU/memory requests for scheduling and limits for containment.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 512Mi
probes:
  path: /actuator/health
  startup:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 18
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
lifecycle:
  preStopSleepSeconds: 10
# podSecurityContext: pod-level non-root UID/GID/filesystem identity.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
# containerSecurityContext: container privilege/capability/filesystem restrictions.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
# topologySpread: distributes replicas across nodes/failure domains.
topologySpread:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
# autoscaling: HPA minimum/maximum replicas and utilization target.
autoscaling:
  minReplicas: 2
  maxReplicas: 5
  cpuAverageUtilization: 70
  scaleDownStabilizationSeconds: 300
# pdb: minimum availability allowed during voluntary disruptions.
pdb:
  minAvailable: 1
