name: orderservice
configMapName: orderservice-config
containerPort: 8084
image:
  repository: 663130434910.dkr.ecr.us-east-1.amazonaws.com/boutique-orderservice
  tag: "1.0.2"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8084
  targetPort: 8084
serviceAccount:
  name: orderservice-sa
  automountServiceAccountToken: false
database:
  secretName: orderservice-db
  url: "jdbc:postgresql://boutique-dev-postgres.ce7qiak863r3.us-east-1.rds.amazonaws.com:5432/order_db"
  username: "boutique_admin"
  password: "8R?0*bDC9W_0E>|OhcR3FdF-RYxa"
config:
  serverPort: "8084"
  corsAllowedOrigins: "https://needystuff.in,http://localhost:4173,http://localhost:5173"
  kafkaBootstrapServers: "kafka:9092"
