# BOUTIQUE-DOCS-BEGIN
# Service: stable in-cluster DNS and port in front of the application's Pods.
# Other services call it as http://<service-name>:<port> inside the namespace.
# BOUTIQUE-DOCS-END

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
