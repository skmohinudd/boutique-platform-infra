# BOUTIQUE-DOCS-BEGIN
# ConfigMap: converts Helm configuration values into runtime environment variables.
# Use it for non-secret settings such as service URLs, ports, topics and feature flags.
# Passwords/tokens must come from Kubernetes Secret/Secrets Store, not this file.
# BOUTIQUE-DOCS-END

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMapName }}
data:
  SERVER_PORT: "{{ .Values.config.serverPort }}"
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  DB_POOL_MAX: "{{ .Values.config.dbPoolMax }}"
  DB_POOL_MIN_IDLE: "{{ .Values.config.dbPoolMinIdle }}"
  DB_POOL_CONNECTION_TIMEOUT_MS: "{{ .Values.config.dbPoolConnectionTimeoutMs }}"
  DB_POOL_VALIDATION_TIMEOUT_MS: "{{ .Values.config.dbPoolValidationTimeoutMs }}"
  DB_POOL_IDLE_TIMEOUT_MS: "{{ .Values.config.dbPoolIdleTimeoutMs }}"
  DB_POOL_MAX_LIFETIME_MS: "{{ .Values.config.dbPoolMaxLifetimeMs }}"
  OPENAPI_ENABLED: "{{ .Values.config.openapiEnabled }}"
  SWAGGER_ENABLED: "{{ .Values.config.swaggerEnabled }}"
  COGNITO_ISSUER_URI: "{{ .Values.config.cognitoIssuerUri }}"
  COGNITO_USERINFO_URI: "{{ .Values.config.cognitoUserInfoUri }}"
