name: checkoutservice
configMapName: checkoutservice-config
containerPort: 8086
image:
  repository: 663130434910.dkr.ecr.us-east-1.amazonaws.com/boutique-checkoutservice-java
  tag: "1.0.2"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8086
  targetPort: 8086
serviceAccount:
  name: checkoutservice-sa
  automountServiceAccountToken: false
config:
  serverPort: "8086"
  corsAllowedOrigins: "https://needystuff.in,http://localhost:4173,http://localhost:5173"
  cartServiceUrl: "http://cartservice:8083"
  orderServiceUrl: "http://orderservice:8084"
  paymentServiceUrl: "http://paymentservice:8085"
  inventoryServiceUrl: "http://inventoryservice:8081"
  openapiEnabled: "false"
  swaggerEnabled: "false"
revisionHistoryLimit: 5
progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 30
strategy:
  type: RollingUpdate
  maxUnavailable: 0
  maxSurge: 1
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 512Mi
probes:
  path: /actuator/health
  startup:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 18
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
lifecycle:
  preStopSleepSeconds: 10
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
topologySpread:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
autoscaling:
  minReplicas: 2
  maxReplicas: 5
  cpuAverageUtilization: 70
  scaleDownStabilizationSeconds: 300
pdb:
  minAvailable: 1
