# BOUTIQUE-DOCS-BEGIN
# Deployment: defines Pods, image, env/config, probes, resources and security.
# Helm values feed this template; Kubernetes keeps the requested Pods running.
# Do not manually kubectl apply a second Deployment with the same name.
# BOUTIQUE-DOCS-END

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}

spec:
  # Keep previous ReplicaSets available for deployment rollback.
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}

  # Perform zero/minimal-downtime rolling application updates.
  strategy:
    type: {{ .Values.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
      maxSurge: {{ .Values.strategy.maxSurge }}

  selector:
    matchLabels:
      app: {{ .Values.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.name }}

    spec:
      # Existing Helm-managed ServiceAccount connected to EKS Pod Identity.
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}

      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      # Apply security defaults to all containers in the Pod.
      securityContext:
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot }}
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}

      # Spread replicas across Kubernetes nodes for better availability.
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ .Values.name }}

      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # Restrict container privileges and Linux capabilities.
          securityContext:
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
            runAsNonRoot: {{ .Values.containerSecurityContext.runAsNonRoot }}
            runAsUser: {{ .Values.containerSecurityContext.runAsUser }}
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          # Load non-sensitive application configuration from ConfigMap.
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}

          # Load database credentials synchronized from AWS Secrets Manager.
          env:
            # Service-specific PostgreSQL JDBC URL from Helm values.
            - name: DB_URL
              value: {{ .Values.database.url | quote }}
            # Current RDS credentials synchronized from AWS Secrets Manager.
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.kubernetesSecretName }}
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.kubernetesSecretName }}
                  key: DB_PASSWORD
            # Service-specific JDBC URL; not a secret.
            # Rotating RDS credentials synchronized from AWS Secrets Manager.
          # Mount AWS Secrets Manager values through the Secrets Store CSI Driver.
          volumeMounts:
            - name: aws-secrets-store
              mountPath: {{ .Values.awsSecrets.mountPath }}
              readOnly: true

          # Define CPU and memory requests/limits for scheduling and protection.
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

          # Allow enough startup time for Spring Boot and database initialization.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          # Send traffic only after the application becomes ready.
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          # Restart the container when the running application becomes unhealthy.
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          # Give the application time to shut down gracefully before termination.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep {{ .Values.lifecycle.preStopSleepSeconds }}"

      # CSI volume connects this Pod to the SecretProviderClass.
      volumes:
        - name: aws-secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.awsSecrets.secretProviderClassName }}

