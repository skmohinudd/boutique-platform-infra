apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMapName }}
data:
  SERVER_PORT: "{{ .Values.config.serverPort }}"
  CORS_ALLOWED_ORIGINS: "{{ .Values.config.corsAllowedOrigins }}"
  KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.config.kafkaBootstrapServers }}"
  KAFKA_PAYMENT_EVENTS_TOPIC: "{{ .Values.config.kafkaPaymentEventsTopic }}"
  SPRING_RABBITMQ_HOST: "{{ .Values.config.rabbitmqHost }}"
  SPRING_RABBITMQ_PORT: "{{ .Values.config.rabbitmqPort }}"
  DEMO_PAYMENT_LATENCY_MS: "{{ .Values.config.demoPaymentLatencyMs }}"
