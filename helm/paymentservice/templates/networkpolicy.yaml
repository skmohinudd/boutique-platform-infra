# BOUTIQUE-DOCS-BEGIN
# NetworkPolicy: controls allowed pod network traffic.
# It complements Service routing; a Service can exist while NetworkPolicy still
# blocks communication, so topology and policy must agree.
# BOUTIQUE-DOCS-END

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-network-policy
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: boutique
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 9092
    - ports:
        - protocol: TCP
          port: 5672
