# BOUTIQUE-DOCS-BEGIN
# ServiceAccount: Kubernetes identity used by Pods.
# AWS access, where required, should be granted through Pod Identity/IRSA rather
# than embedding long-lived AWS credentials in the Pod.
# BOUTIQUE-DOCS-END

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
