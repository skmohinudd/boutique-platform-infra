# BOUTIQUE-VALUES-SECTIONS-BEGIN
# Section comments below explain the responsibility of major values keys.
# BOUTIQUE-VALUES-SECTIONS-END
# BOUTIQUE-DOCS-BEGIN
# Central values for this Helm chart.
# Templates read these values using {{ .Values.<key> }}.
# Change Kubernetes desired configuration here rather than using kubectl edit.
# CI/CD intentionally overrides image.repository and image.tag at deployment time
# so Nexus JAR, ECR image, Helm release and EKS run the same immutable version.
# BOUTIQUE-DOCS-END

redis:
  image: redis:7.4-alpine
kafka:
  image: apache/kafka:4.3.1
rabbitmq:
  image: rabbitmq:4-management-alpine
  username: "boutique"
  password: "boutique_password"
mailpit:
  image: mailhog/mailhog:v1.0.1
