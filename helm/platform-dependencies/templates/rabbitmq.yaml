# BOUTIQUE-DOCS-BEGIN
# Shared platform dependency: rabbitmq.
# Owned once by platform-dependencies and consumed by multiple microservices
# through stable Kubernetes DNS. Do not duplicate this dependency per service.
# BOUTIQUE-DOCS-END

apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
type: Opaque
stringData:
  SPRING_RABBITMQ_USERNAME: "{{ .Values.rabbitmq.username }}"
  SPRING_RABBITMQ_PASSWORD: "{{ .Values.rabbitmq.password }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: "{{ .Values.rabbitmq.username }}"}
            - {name: RABBITMQ_DEFAULT_PASS, value: "{{ .Values.rabbitmq.password }}"}
          ports:
            - {containerPort: 5672, name: amqp}
            - {containerPort: 15672, name: management}
          readinessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
